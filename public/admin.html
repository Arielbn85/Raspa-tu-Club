<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Raspa Primera · Creador</title>
<meta name="theme-color" content="#0f2a1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
[hidden]{display:none!important}
/* Cancha de noche: cartón central sobre césped rayado */
:root{
  --pitch:#0f2a1f; --pitch2:#123326; --line:#e9efe6; --gold:#f2b632; --gold-ink:#2a1d00;
  --card:#f7f5ee; --ink:#14201a; --muted:#9db3a6; --panel:#16382a; --edge:#2b5a45; --edge2:#3b6f57;
  --win:#ff7a2f; --lose:#8fa598; --danger:#ff6b5a;
  --display:"Bungee","Impact",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pitch);color:var(--line);font-family:var(--body);font-size:16px;
  background-image:repeating-linear-gradient(90deg,var(--pitch) 0 56px,var(--pitch2) 56px 112px);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:18px}
header{text-align:center;display:grid;gap:4px}
.eyebrow{font-family:var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-size:14px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,44px);margin:0;line-height:1;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:15px}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:14px}
h2{font-family:var(--cond);text-transform:uppercase;letter-spacing:.12em;font-size:15px;color:var(--gold);margin:0 0 10px}
input{background:#0c2219;border:1px solid var(--edge2);color:var(--line);border-radius:10px;padding:10px 12px;font:16px var(--body);min-width:0}
input.code{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.25em;text-transform:uppercase;text-align:center;width:100%}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:12px 16px;font:700 16px var(--body);cursor:pointer;background:var(--gold);color:var(--gold-ink);text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--line);border:1px solid var(--edge2)}
.btn.danger{background:var(--danger);color:#2a0600}
.btn.small{padding:7px 11px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > input{flex:1 1 140px}
.stack{display:grid;gap:10px}
.err{color:var(--danger);font-weight:600;min-height:1.2em;margin:0}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:#0c2219;border-radius:10px;padding:8px 4px}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
.ticket{background:var(--card);color:var(--ink);border-radius:18px;padding:14px;position:relative;box-shadow:0 14px 40px #0008;border:3px dashed #d9d3c2}
.ticket-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.ticket-head strong{font-family:var(--display);font-weight:400;font-size:20px}
.ticket-head span{font-family:var(--cond);font-size:14px;color:#5a6b62;letter-spacing:.06em}
.gridwrap{position:relative}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:#fff;border:1px solid #e3ded0;border-radius:12px;padding:8px 4px 6px;display:grid;justify-items:center;gap:2px;text-align:center;min-width:0;transition:transform .25s}
.cell svg{width:58px;height:58px}
.cell .v{font-family:var(--cond);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.cell .n{font-size:13px;color:#46564d;line-height:1.1;overflow-wrap:anywhere}
.cell.hit{background:var(--win);border-color:var(--win);transform:scale(1.03)}
.cell.hit .n,.cell.hit .v{color:#2a0f00}
.grid.done .cell:not(.hit){opacity:.5}
canvas.scratch{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;touch-action:none;cursor:crosshair}
.result{margin-top:12px;font-family:var(--display);font-weight:400;font-size:20px;text-align:center;min-height:1.3em}
.result.lose{color:#5d7468;font-family:var(--body);font-weight:700;font-size:17px}
.empty{text-align:center;color:#5a6b62;padding:40px 10px;font-weight:600}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
td,th{padding:6px 4px;border-bottom:1px solid var(--edge);text-align:left;vertical-align:middle}
th{font-family:var(--cond);color:var(--muted);font-weight:600;letter-spacing:.05em}
td.r,th.r{text-align:right}
.mini{display:inline-block;width:20px;height:20px;vertical-align:-5px;margin-right:6px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:8px;gap:8px;flex-wrap:wrap}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:15px}
.list li{display:flex;justify-content:space-between;gap:8px}
.list .w{color:var(--gold);font-weight:700}
.player{border-bottom:1px solid var(--edge);padding-block:10px;display:grid;gap:8px}
.player .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.player .name{font-weight:700;font-size:17px}
.player .code{font-family:var(--cond);font-weight:700;letter-spacing:.18em;color:var(--gold);font-size:18px}
.player .nums{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:0 8px 24px #0008}
@media (prefers-reduced-motion:reduce){.cell{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Panel del creador</div>
    <h1>Raspa Primera</h1>
  </header>

  <section class="panel stack" id="login">
    <h2>Contraseña de creador</h2>
    <form id="loginForm" class="row">
      <input type="password" id="pw" autocomplete="current-password" aria-label="Contraseña">
      <button class="btn" type="submit" id="loginBtn">Entrar</button>
    </form>
    <p class="err" id="loginErr"></p>
  </section>

  <div id="panel" class="stack" hidden>
    <section class="panel stack">
      <h2>Nuevo jugador</h2>
      <form id="newForm" class="row">
        <input id="newName" maxlength="20" placeholder="Nombre" aria-label="Nombre">
        <input id="newInt" type="number" min="0" max="999" value="5" style="flex:0 0 80px" aria-label="Intentos iniciales">
        <button class="btn" type="submit">Crear</button>
      </form>
      <p class="note">Se genera un código de 6 letras. Mandáselo al jugador por WhatsApp con el botón de cada uno.</p>
    </section>

    <section class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <h2 style="margin:0">Jugadores</h2>
        <div class="row">
          <button class="btn ghost small" type="button" id="allPlus">+1 a todos</button>
          <button class="btn ghost small" type="button" id="refresh">Actualizar</button>
        </div>
      </div>
      <div id="players"></div>
    </section>

    <section class="panel">
      <h2>Tabla de premios · serie actual</h2>
      <div class="tablewrap"><table id="prizeTable"></table></div>
      <div class="meta"><span id="seriesInfo"></span><span>Gana 1 de cada 6</span></div>
    </section>

    <section class="panel">
      <h2>Últimos cartones</h2>
      <ul class="list" id="hist"></ul>
    </section>

    <section class="panel stack">
      <h2>Opciones</h2>
      <div id="dangerZone" class="row">
        <button class="btn ghost" type="button" data-ask="nuevaSerie">Empezar serie nueva</button>
        <button class="btn ghost" type="button" data-ask="reiniciarPuntos">Poner premios en cero</button>
      </div>
      <button class="btn ghost small" type="button" id="logout" style="justify-self:start">Cerrar sesión</button>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// Camisetas dibujadas con los colores tradicionales de cada club (sin escudos ni marcas)
const VIS = {
  oli: { sig: 'OLI', c: ['#ffffff', '#111111'], p: 'band' },
  ccp: { sig: 'CCP', c: ['#c8102e', '#1c3f94'], p: 'stripes' },
  lib: { sig: 'LIB', c: ['#ffffff', '#111111'], p: 'stripes' },
  gua: { sig: 'GUA', c: ['#f4c400', '#111111'], p: 'stripes' },
  nac: { sig: 'NAC', c: ['#ffffff', '#c8102e', '#1c3f94'], p: 'trim' },
  luq: { sig: 'LUQ', c: ['#f4c400', '#1c3f94'], p: 'stripes' },
  tri: { sig: 'TRI', c: ['#1c3f94', '#f4c400'], p: 'cross' },
  ame: { sig: 'AME', c: ['#ffffff', '#1c3f94'], p: 'vee' },
  slo: { sig: 'SLO', c: ['#ffffff', '#c8102e'], p: 'stripes' },
  rec: { sig: 'REC', c: ['#f6d21c', '#1c3f94'], p: 'trim2' },
  dos: { sig: '2DM', c: ['#ffffff', '#74b9e6'], p: 'stripes' },
  rnu: { sig: 'RÑU', c: ['#ffffff', '#2a8f4a'], p: 'band' }
};

let _jid = 0;
function jersey(id, size, cls) {
  const v = VIS[id];
  if (!v) return '';
  const [a, b, d] = v.c;
  const cid = 'cl' + id + (++_jid);
  const body = 'M18 8 L30 4 Q40 12 50 4 L62 8 L76 22 L66 32 L60 27 L60 74 L20 74 L20 27 L14 32 L4 22 Z';
  const sleeves = col => `<path d="M4 22 L14 32 L18 28 L8 18 Z M76 22 L66 32 L62 28 L72 18 Z" fill="${col}"/>`;
  const collar = col => `<path d="M30 4 Q40 12 50 4 L52 6 Q40 16 28 6 Z" fill="${col}"/>`;
  let fill = '';
  if (v.p === 'stripes') { for (let x = 8; x < 76; x += 12) fill += `<rect x="${x}" y="0" width="6" height="80" fill="${b}"/>`; }
  else if (v.p === 'band') fill = `<rect x="0" y="34" width="80" height="12" fill="${b}"/>`;
  else if (v.p === 'cross') fill = `<rect x="0" y="32" width="80" height="10" fill="${b}"/><rect x="35" y="0" width="10" height="80" fill="${b}"/>`;
  else if (v.p === 'vee') fill = `<path d="M22 8 L40 40 L58 8 L50 8 L40 28 L30 8 Z" fill="${b}"/>` + collar(b);
  else if (v.p === 'trim') fill = sleeves(b) + collar(d) + `<rect x="20" y="68" width="40" height="3" fill="${d}"/><rect x="20" y="71" width="40" height="3" fill="${b}"/>`;
  else if (v.p === 'trim2') fill = sleeves(b) + collar(b);
  return `<svg ${cls ? `class="${cls}"` : ''} viewBox="0 0 80 80" width="${size}" height="${size}" aria-hidden="true"><defs><clipPath id="${cid}"><path d="${body}"/></clipPath></defs>
  <g clip-path="url(#${cid})"><rect width="80" height="80" fill="${a}"/>${fill}</g>
  <path d="${body}" fill="none" stroke="#14201a" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="40" y="64" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="13" fill="#14201a" stroke="#fff" stroke-width="3" paint-order="stroke">${v.sig}</text></svg>`;
}

function prizeLabel(c) { return c.free ? 'Otro cartón' : c.pts.toLocaleString('es-PY'); }

function escapeH(s) { return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }

async function api(path, body) {
  let r;
  try {
    r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  } catch (e) { throw new Error('Sin conexión. Revisá tu internet e intentá de nuevo.'); }
  const j = await r.json().catch(() => ({ error: 'El servidor no respondió bien. Intentá de nuevo.' }));
  if (!r.ok) throw new Error(j.error || 'Algo salió mal.');
  return j;
}

function renderTable(el, tabla) {
  el.innerHTML = `<tr><th>Club ×3</th><th class="r">Premio</th><th class="r">Quedan</th></tr>` +
    tabla.clubes.map(c => `<tr><td>${jersey(c.id, 20, 'mini')}${escapeH(c.name)}</td><td class="r">${prizeLabel(c)}</td><td class="r">${c.quedan} de ${c.n}</td></tr>`).join('');
}

function sGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function sSet(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
</script>
<script>
const $ = id => document.getElementById(id);
let PW = null, S = null, confirmDel = null;

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2200);
}

async function call(action, extra) {
  const d = await api('/api/admin', { password: PW, action, ...(extra || {}) });
  S = d; render(); return d;
}

async function login(pw) {
  $('loginBtn').disabled = true; $('loginErr').textContent = '';
  PW = pw;
  try {
    await call('estado');
    try { sessionStorage.setItem('raspa_pw', pw); } catch (e) {}
    $('login').hidden = true; $('panel').hidden = false;
  } catch (e) {
    PW = null; $('loginErr').textContent = e.message;
    try { sessionStorage.removeItem('raspa_pw'); } catch (e2) {}
  } finally { $('loginBtn').disabled = false; }
}

function link(code) { return `${location.origin}/?c=${code}`; }

function render() {
  const ps = S.jugadores;
  $('players').innerHTML = ps.length ? ps.map(p => `
    <div class="player">
      <div class="top"><span class="name">${escapeH(p.name)}</span><span class="code">${p.code}</span></div>
      <div class="nums">${p.intentos} intentos · ${p.pts.toLocaleString('es-PY')} en premios para canjear · ganó ${(p.ganados ?? p.pts).toLocaleString('es-PY')} · ${p.jugados} jugados${p.canjeados ? ` · canjeó ${p.canjeados}` : ''}</div>
      <div class="row">
        <button class="btn small" type="button" data-add="${p.code}" data-n="1">+1</button>
        <button class="btn small" type="button" data-add="${p.code}" data-n="5">+5</button>
        <button class="btn ghost small" type="button" data-add="${p.code}" data-n="-1">−1</button>
        <a class="btn ghost small" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(`¡Jugá Raspa Primera! Tocá este link y raspá tu cartón: ${link(p.code)}`)}">WhatsApp</a>
        <button class="btn ghost small" type="button" data-copy="${p.code}">Copiar link</button>
        ${confirmDel === p.code
          ? `<button class="btn danger small" type="button" data-del="${p.code}">Sí, borrar</button><button class="btn ghost small" type="button" data-nodel>Cancelar</button>`
          : `<button class="btn ghost small" type="button" data-askdel="${p.code}">Borrar</button>`}
      </div>
    </div>`).join('') : '<p class="note">Todavía no creaste jugadores.</p>';

  renderTable($('prizeTable'), S.tabla);
  $('seriesInfo').textContent = `Serie ${S.tabla.serie} · quedan ${S.tabla.quedan} de ${S.tabla.total}`;
  $('hist').innerHTML = S.hist.length ? S.hist.slice(0, 30).map(h => {
    const when = new Date(h.ts).toLocaleString('es-PY', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    if (h.canje) return `<li><span>${escapeH(h.name)} · canje · ${when}</span><span>Canjeó ${h.canje} cartón${h.canje > 1 ? 'es' : ''}</span></li>`;
    const prem = h.premio ? (h.premio.free ? 'Otro cartón' : `+${h.premio.pts.toLocaleString('es-PY')}`) : 'Sin premio';
    return `<li><span>${escapeH(h.name)} · S${h.serie}-${h.nro} · ${when}</span><span class="${h.premio ? 'w' : ''}">${prem}</span></li>`;
  }).join('') : '<li><span>Todavía no se jugó ningún cartón.</span></li>';
}

$('players').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  try {
    if (b.dataset.add) { await call('sumar', { code: b.dataset.add, cantidad: +b.dataset.n }); toast('Intentos actualizados'); }
    else if (b.dataset.askdel) { confirmDel = b.dataset.askdel; render(); }
    else if (b.hasAttribute('data-nodel')) { confirmDel = null; render(); }
    else if (b.dataset.del) { confirmDel = null; await call('borrar', { code: b.dataset.del }); toast('Jugador borrado'); }
    else if (b.dataset.copy) {
      const txt = link(b.dataset.copy);
      try { await navigator.clipboard.writeText(txt); toast('Link copiado'); }
      catch (err) { toast(txt); }
    }
  } catch (err) { toast(err.message); }
});

$('newForm').addEventListener('submit', async e => {
  e.preventDefault();
  const nombre = $('newName').value.trim(); if (!nombre) return;
  try { await call('crear', { nombre, intentos: +$('newInt').value || 0 }); $('newName').value = ''; toast('Jugador creado'); }
  catch (err) { toast(err.message); }
});

$('allPlus').onclick = async () => { try { await call('sumarTodos', { cantidad: 1 }); toast('+1 intento a todos'); } catch (e) { toast(e.message); } };
$('refresh').onclick = async () => { try { await call('estado'); toast('Actualizado'); } catch (e) { toast(e.message); } };

const LABELS = { nuevaSerie: '¿Empezar una serie nueva de 200 cartones?', reiniciarPuntos: '¿Poner en cero los premios de todos y borrar el historial?' };
function resetDanger() {
  $('dangerZone').innerHTML = '<button class="btn ghost" type="button" data-ask="nuevaSerie">Empezar serie nueva</button><button class="btn ghost" type="button" data-ask="reiniciarPuntos">Poner premios en cero</button>';
}
$('dangerZone').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.ask) {
    $('dangerZone').innerHTML = `<span>${LABELS[b.dataset.ask]}</span><button class="btn danger" type="button" data-do="${b.dataset.ask}">Sí</button><button class="btn ghost" type="button" data-cancel>Cancelar</button>`;
  } else if (b.dataset.do) {
    try { await call(b.dataset.do); toast('Listo'); } catch (err) { toast(err.message); }
    resetDanger();
  } else if (b.hasAttribute('data-cancel')) resetDanger();
});

$('loginForm').addEventListener('submit', e => { e.preventDefault(); const v = $('pw').value; if (v) login(v); });
$('logout').onclick = () => { try { sessionStorage.removeItem('raspa_pw'); } catch (e) {} PW = null; $('pw').value = ''; $('panel').hidden = true; $('login').hidden = false; };

let savedPw = null; try { savedPw = sessionStorage.getItem('raspa_pw'); } catch (e) {}
if (savedPw) login(savedPw);
</script>
</body>
</html>
